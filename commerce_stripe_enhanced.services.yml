services:
  commerce_stripe_enhanced.express_checkout_context:
    class: Drupal\commerce_stripe_enhanced\ExpressCheckoutContext
    arguments: ['@current_route_match']
  commerce_stripe_enhanced.shipping_rate_variants_subscriber:
    class: Drupal\commerce_stripe_enhanced\EventSubscriber\ShippingRateVariantsSubscriber
    arguments: ['@commerce_stripe_enhanced.express_checkout_context']
    tags:
      - { name: event_subscriber }
  commerce_stripe_enhanced.express_methods:
    class: Drupal\commerce_stripe_enhanced\ExpressMethods
    arguments:
      - '@entity_type.manager'
      - '@config.factory'
      - '@plugin.manager.commerce_payment_method_type'
  commerce_stripe_enhanced.express_checkout:
    class: Drupal\commerce_stripe_enhanced\ExpressCheckout
    arguments:
      - '@config.factory'
      - '@commerce_stripe.express_checkout_buttons_builder'
      - '@commerce_stripe_enhanced.express_methods'
  commerce_stripe_enhanced.payment_method_limits:
    class: Drupal\commerce_stripe_enhanced\PaymentMethodLimits
  commerce_stripe_enhanced.payment_options_subscriber:
    class: Drupal\commerce_stripe_enhanced\EventSubscriber\PaymentOptionsSubscriber
    arguments:
      - '@entity_type.manager'
      - '@commerce_stripe_enhanced.express_methods'
      - '@commerce_stripe_enhanced.payment_method_limits'
    tags:
      - { name: event_subscriber }
  commerce_stripe_enhanced.payment_intent_subscriber:
    class: Drupal\commerce_stripe_enhanced\EventSubscriber\StripePaymentIntentSubscriber
    arguments:
      - '@commerce_stripe_enhanced.express_methods'
      - '@commerce_stripe_enhanced.payment_method_limits'
    tags:
      - { name: event_subscriber }
  commerce_stripe_enhanced.payment_breakdown:
    class: Drupal\commerce_stripe_enhanced\PaymentBreakdown
    arguments:
      - '@commerce_price.minor_units_converter'
      - '@commerce_price.currency_formatter'
  commerce_stripe_enhanced.payment_breakdown_subscriber:
    class: Drupal\commerce_stripe_enhanced\EventSubscriber\PaymentBreakdownSubscriber
    arguments: ['@commerce_stripe_enhanced.payment_breakdown']
    tags:
      - { name: event_subscriber }
  commerce_stripe_enhanced.express_checkout_subscriber:
    class: Drupal\commerce_stripe_enhanced\EventSubscriber\StripeExpressCheckoutSubscriber
    arguments: ['@config.factory']
    tags:
      - { name: event_subscriber }
